name: Sync GreatLink Fund Prices

on:
  schedule:
    # 15:30 UTC = 23:30 SGT, weekdays — after Great Eastern confirms the day's fund prices.
    - cron: '30 15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Both scheduled runs to date hung on the Vercel deploy step and were silently killed by
    # GitHub's 6-hour default job timeout, so the site never actually redeployed with fresh
    # data despite the fetch+commit steps succeeding every time. Bound the job so a hang fails
    # fast and shows up as a red X instead of burning hours unnoticed.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest GreatLink fund prices
        run: node scripts/syncFundPrices.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/data/funds; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated fund prices
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "alfred-fund-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/funds
          git commit -m "Sync GreatLink fund prices ($(date -u +%Y-%m-%d))"
          git push

      - name: Install Vercel CLI
        if: steps.diff.outputs.changed == 'true'
        run: npm install --global vercel@latest

      - name: Link Vercel project
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_cyRGzyDbWfW1ng4M9u0aOYlQiGP2","orgId":"team_TIUKjFSuVZKD2TjV7h0AxwO5","projectName":"fa-dashboard"}' > .vercel/project.json

      - name: Deploy to Vercel production
        if: steps.diff.outputs.changed == 'true'
        id: deploy
        timeout-minutes: 8
        run: |
          OUTPUT=$(timeout 450 vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            echo "::error::vercel deploy exited with status $STATUS (timed out or failed) — see output above"
            exit $STATUS
          fi
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not find a deployment URL in vercel's output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Point alfred-ge.vercel.app at the new deployment
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 3
        run: timeout 120 vercel alias set "${{ steps.deploy.outputs.url }}" alfred-ge.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
